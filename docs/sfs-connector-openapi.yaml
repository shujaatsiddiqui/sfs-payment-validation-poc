openapi: 3.0.0
info:
  title: SFS Payment Validation Connector
  description: Custom connector for SFS payment validation using business rules BR-005 and BR-008
  version: 1.0.0
  contact:
    name: SFS Payment Validation Team
    email: support@sfs.com

servers:
  - url: https://ca-sfs-payment-validation.purpleglacier-ca7d6433.centralus.azurecontainerapps.io
    description: Azure Container App endpoint

# Security configuration for Azure AD OAuth 2.0 (Managed Identity)
security:
  - azure_ad_oauth: []

paths:
  /api/SfsValidatePayment:
    post:
      summary: Validate SFS Payment
      description: Validates a payment against SFS business rules (BR-005 Zero Payment Amount, BR-008 Account Status 93)
      operationId: SfsValidatePayment
      x-ms-visibility: important
      requestBody:
        required: true
        description: Payment validation request containing payment ID and rule selection
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationRequest'
            examples:
              validateAll:
                summary: Validate all rules
                value:
                  paymentId: "PAY-001"
                  ruleSelection: "All Rules"
              validateBR005:
                summary: Validate BR-005 only
                value:
                  paymentId: "PAY-002"
                  ruleSelection: "BR-005"
              validateBR008:
                summary: Validate BR-008 only
                value:
                  paymentId: "PAY-003"
                  ruleSelection: "BR-008"
      responses:
        '200':
          description: Validation completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              examples:
                validPayment:
                  summary: Valid payment
                  value:
                    isValid: true
                    errors: []
                invalidPayment:
                  summary: Invalid payment
                  value:
                    isValid: false
                    errors:
                      - "BR-005: Zero Payment Amount"
                      - "BR-008: Account status 93 blocks posting"
        '400':
          description: Bad request - Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingPaymentId:
                  summary: Missing payment ID
                  value:
                    error: "PaymentId is required"
                invalidJson:
                  summary: Invalid JSON
                  value:
                    error: "Invalid JSON format"
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: Payment not found
                  value:
                    error: "Payment PAY-999 not found"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                serverError:
                  summary: Server error
                  value:
                    error: "Internal server error"

components:
  securitySchemes:
    azure_ad_oauth:
      type: oauth2
      description: Azure Active Directory OAuth 2.0 authentication for Managed Identity
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/common/oauth2/v2.0/token
          scopes:
            https://management.azure.com/.default: Access Azure resources
      x-ms-authorization-url-template: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
      x-ms-token-url-template: https://login.microsoftonline.com/common/oauth2/v2.0/token

  schemas:
    ValidationRequest:
      type: object
      required:
        - paymentId
      properties:
        paymentId:
          type: string
          description: The unique identifier for the payment to validate
          example: "PAY-001"
          x-ms-summary: Payment ID
          x-ms-visibility: important
        ruleSelection:
          type: string
          description: Which business rules to apply during validation
          enum:
            - "All Rules"
            - "BR-005"
            - "BR-008"
          default: "All Rules"
          example: "All Rules"
          x-ms-summary: Rule Selection
          x-ms-visibility: advanced

    ValidationResponse:
      type: object
      properties:
        isValid:
          type: boolean
          description: Indicates whether the payment passed all validations
          example: true
          x-ms-summary: Is Valid
          x-ms-visibility: important
        errors:
          type: array
          description: List of validation errors (empty if payment is valid)
          items:
            type: string
          example: []
          x-ms-summary: Validation Errors
          x-ms-visibility: important

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message describing what went wrong
          example: "PaymentId is required"
          x-ms-summary: Error Message

# Logic Apps specific extensions
x-ms-connector-metadata:
  - propertyName: Website
    propertyValue: https://sfs-payment-validation.com
  - propertyName: Privacy policy
    propertyValue: https://sfs-payment-validation.com/privacy
  - propertyName: Categories
    propertyValue: Finance;Business Intelligence

tags:
  - name: Payment Validation
    description: Operations for validating SFS payments against business rules
